[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fxwatch"
version = "1.0.0"
description = "Exchange-rate monitoring and threshold alerts built on official and credible sources."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jesse Asimeng" }]
dependencies = [
    "streamlit>=1.50,<2",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "jinja2>=3.1,<4",
    "plotly>=5.22",
    "pandas>=2.2",
    "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
fxwatch = "fxwatch.cli:main"

[tool.setuptools.packages.find]
include = ["fxwatch*"]

[tool.setuptools.package-data]
fxwatch = ["notify/templates/*", "db/migrations/*.py", "db/migrations/*.mako", "db/migrations/versions/*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # line length is left to `ruff format`

[tool.ruff.lint.per-file-ignores]
"fxwatch/db/migrations/*" = ["I001", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["fxwatch"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
