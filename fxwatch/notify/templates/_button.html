{% macro button(url, label) %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:22px 0;">
  <tr><td style="border-radius:8px;background:#1769aa;">
    <a href="{{ url }}" style="display:inline-block;padding:12px 22px;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;">{{ label }}</a>
  </td></tr>
</table>
{% endmacro %}
