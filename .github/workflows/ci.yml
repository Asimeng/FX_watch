name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test (SQLite)
        run: pytest -p no:warnings

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fxwatch
          POSTGRES_PASSWORD: fxwatch
          POSTGRES_DB: fxwatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fxwatch" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fxwatch:fxwatch@localhost:5432/fxwatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test (PostgreSQL)
        run: pytest -p no:warnings
