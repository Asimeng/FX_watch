<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f3f5f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1d2433;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f5f8;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e3e7ee;">
        <tr>
          <td style="background:#0f3d5e;padding:18px 28px;">
            <a href="{{ app_url }}" style="color:#ffffff;text-decoration:none;font-weight:700;font-size:18px;letter-spacing:.2px;">{{ app_name }}</a>
          </td>
        </tr>
        <tr>
          <td style="padding:28px;font-size:15px;line-height:1.55;">
            {% block body %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:18px 28px;background:#f8f9fb;border-top:1px solid #e3e7ee;font-size:12px;line-height:1.5;color:#6b7385;">
            {% block footer %}{% endblock %}
            Rates are mid-market reference rates for information only and are not an offer to trade.
            Banks and bureaux apply their own spreads and fees.
            {% if unsubscribe_url %}<br><a href="{{ unsubscribe_url }}" style="color:#6b7385;">Unsubscribe from all alerts</a>{% endif %}
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
